<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOSCATELLI — Project Index</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="project-index" class="project-index-page">
  <main class="project-index" aria-label="Moscatelli project index">
    <div class="project-index__atmosphere" aria-hidden="true"></div>

    <header class="project-index__header" aria-label="Project header">
      <div class="project-index__header-inner">
        <div class="project-index__header-monogram-wrap" aria-hidden="true"><img src="assets/images/moscatelli-monogram.png" alt="" class="project-index__header-monogram" /></div>

        <nav class="project-index__language-toggle" aria-label="Language selector">
          <button type="button" class="project-index__language is-active" aria-pressed="true">English</button>
          <button type="button" class="project-index__language" aria-pressed="false">Italiano</button>
          <button type="button" class="project-index__language" aria-pressed="false">Español</button>
          <button type="button" class="project-index__language" aria-pressed="false">Português</button>
        </nav>
      </div>
    </header>

    <section class="project-index__stage" aria-label="Primary project routes">
      <div class="project-index__cards">
        <button type="button" class="project-card">
          <span class="project-card__kicker">01</span>
          <span class="project-card__title">The House</span>
          <span class="project-card__body">Why Moscatelli exists, what it stands for, and why the house deserves belief.</span>
        </button>

        <button type="button" class="project-card">
          <span class="project-card__kicker">02</span>
          <span class="project-card__title">Lotto I</span>
          <span class="project-card__body">The scarf, the ritual, the product logic, and the opening commercial gesture.</span>
        </button>

        <button type="button" class="project-card">
          <span class="project-card__kicker">03</span>
          <span class="project-card__title">The Investment Case</span>
          <span class="project-card__body">Market, model, roadmap, founder, and the reasons capital belongs here.</span>
        </button>
      </div>

      <div class="project-index__radial" aria-hidden="true">
        <div class="project-index__radial-label"></div>
        <div class="project-index__radial-shell">
          <button type="button" class="project-index__radial-center" aria-label="Return to sections">Return</button>
          <div class="project-index__radial-orbit">
            <button type="button" class="project-index__radial-item project-index__radial-item--north" data-slot="0">Subcategory I</button>
            <button type="button" class="project-index__radial-item project-index__radial-item--east" data-slot="1">Subcategory II</button>
            <button type="button" class="project-index__radial-item project-index__radial-item--south" data-slot="2">Subcategory III</button>
            <button type="button" class="project-index__radial-item project-index__radial-item--west" data-slot="3">Subcategory IV</button>
          </div>
        </div>
      </div>

    </section>

    <footer class="project-index__footer">
      <div class="project-index__footer-disclaimer">Confidential · Not for distribution</div>
      <div class="project-index__footer-wordmark">MOSCATELLI</div>
    </footer>
  </main>

  <script src="assets/js/site.js"></script>
</body>
</html>
